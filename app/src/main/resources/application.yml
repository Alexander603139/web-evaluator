spring:
  application:
    name: web-evaluator
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:web_evaluator}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
  jackson:
      default-property-inclusion: always

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}

jwt:
  secret: "super-secret-key-for-jwt-generation-must-be-at-least-256-bits-long-for-hmac-sha256!!!"
  access-expiration: 900000 # 15 минут
  refresh-expiration: 604800000 # 7 дней

s3:
  endpoint: ${S3_ENDPOINT}
  access-key: ${S3_ACCESS_KEY}
  secret-key: ${S3_SECRET_KEY}
  bucket: ${S3_BUCKET_NAME}
  region: ${S3_REGION:-ru-1}