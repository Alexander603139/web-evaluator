spring:
  application:
    name: web-evaluator
  datasource:
    url: jdbc:postgresql://localhost:5432/web_evaluator
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
