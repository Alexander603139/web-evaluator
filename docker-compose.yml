version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-evaluator-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/web_evaluator
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_FLYWAY_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: web-evaluator-postgres
    environment:
      POSTGRES_DB: web_evaluator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  admin-ui:
    image: nginx:alpine
    container_name: web-evaluator-admin-ui
    ports:
      - "80:80"
    volumes:
      - ./admin-ui:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  postgres_data:
