version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-evaluator-app
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=8080
      - DB_NAME=web_evaluator
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=web_evaluator
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: