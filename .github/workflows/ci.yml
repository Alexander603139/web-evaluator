name: Deploy to Timeweb (Java)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  push:
    branches: [ "main" ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean server directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TIMEWEB_HOST }}
          username: root
          key: ${{ secrets.TIMEWEB_SSH_KEY }}
          script: |
            rm -rf /opt/web-evaluator
            mkdir -p /opt/web-evaluator

      - name: Copy files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.TIMEWEB_HOST }}
          username: root
          key: ${{ secrets.TIMEWEB_SSH_KEY }}
          source: "."
          target: "/opt/web-evaluator"
          overwrite: true

      - name: Create .env file on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TIMEWEB_HOST }}
          username: root
          key: ${{ secrets.TIMEWEB_SSH_KEY }}
          script: |
            cd /opt/web-evaluator
            cat > .env << 'EOF'
            DB_HOST=db
            DB_PORT=5432
            DB_NAME=web_evaluator
            DB_USER=postgres
            DB_PASSWORD=postgres
            SERVER_PORT=8080
            ADMIN_USERNAME=admin
            ADMIN_PASSWORD=change-me-in-production
            EOF

      - name: Restart Docker containers
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TIMEWEB_HOST }}
          username: root
          key: ${{ secrets.TIMEWEB_SSH_KEY }}
          script: |
            cd /opt/web-evaluator
          
            echo "=== [1/4] Pulling new remote images ==="
            docker compose pull
          
            echo "=== [2/4] Building changed local images ==="
            # Убираем --no-cache. Docker сам поймет по кэшу, изменился ли код.
            docker compose build
          
            echo "=== [3/4] Starting updated containers ==="
            # Одна команда обновит и скачанные, и пересобранные контейнеры. Остальные не тронет.
            docker compose up -d --remove-orphans
          
            echo "=== [4/4] Healthcheck ==="
            sleep 20
            if curl -fs --max-time 5 "http://localhost:8080/actuator/health" > /dev/null 2>&1; then
              echo "✅ Application is healthy"
            else
              echo "❌ Healthcheck failed. Last 50 lines of logs:"
              docker compose logs --tail=50
              exit 1
            fi
          
            # Очистка старых образов после успешного запуска
            docker image prune -f
            echo "🎉 Deploy completed successfully"