name: Deploy to Timeweb (Java)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  push:
    branches: [ "main" ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.TIMEWEB_HOST }}
          username: root
          key: ${{ secrets.TIMEWEB_SSH_KEY }}
          source: "."
          target: "/opt/web-evaluator"
          overwrite: true

      - name: Create .env file on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TIMEWEB_HOST }}
          username: root
          key: ${{ secrets.TIMEWEB_SSH_KEY }}
          script: |
            cd /opt/web-evaluator
            cat > .env << 'EOF'
            DB_HOST=db
            DB_PORT=5432
            DB_NAME=web_evaluator
            DB_USER=postgres
            DB_PASSWORD=postgres
            SERVER_PORT=8080
            ADMIN_USERNAME=admin
            ADMIN_PASSWORD=change-me-in-production
            EOF

      - name: Restart Docker containers
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TIMEWEB_HOST }}
          username: root
          key: ${{ secrets.TIMEWEB_SSH_KEY }}
          script: |
            cd /opt/web-evaluator
            echo "=== [1/4] Stopping containers ==="
            docker compose down
            
            echo "=== [2/4] Building images with clean ==="
            docker compose build --no-cache
            
            echo "=== [3/4] Starting containers ==="
            docker compose up -d --remove-orphans
            
            echo "=== [4/4] Healthcheck ==="
            sleep 20
            if curl -fs --max-time 5 "http://localhost:8080/actuator/health" > /dev/null 2>&1; then
              echo "✅ Application is healthy"
            else
              echo "❌ Healthcheck failed. Last 50 lines of logs:"
              docker compose logs --tail=50
              exit 1
            fi
            
            docker image prune -f
            echo "🎉 Deploy completed successfully"